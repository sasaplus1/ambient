name: automerge-gate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - auto_merge_enabled
  pull_request_review:
    types:
      - submitted

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  gate:
    if: ${{ github.event_name != 'pull_request_review' || github.event.review.state == 'approved' }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      statuses: write
      checks: read
      pull-requests: read
      actions: read
    steps:
      - uses: pkgdeps/automerge-gate@9ab7a1d211aca48667cdbf94cca05ae67b64eba2 # v5.0.5
        with:
          gate-mode: private
          context: automerge-gate/all-passed
